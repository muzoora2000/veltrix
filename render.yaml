services:
  - type: web
    name: hydrosense-server
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: HydroSense Platform
      - key: EMAIL_FROM_ADDRESS
        value: muzoora2000@gmail.com
